# render.yaml — Configuración de despliegue en Render.com
# Documentación: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: educandes-backend
    runtime: node
    region: oregon
    plan: free

    # Todo el repo es la raíz; el backend vive en /backend
    rootDir: backend

    buildCommand: >
      npm install &&
      npx prisma generate --schema prisma/schema.prod.prisma &&
      npm run build &&
      npx prisma db push --schema prisma/schema.prod.prisma &&
      npx tsx prisma/seed.ts

    startCommand: node dist/index.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render crea la base de datos y pasa la URL automáticamente
      - key: DATABASE_URL
        fromDatabase:
          name: educandes-db
          property: connectionString

      # Render genera un secreto aleatorio en cada deploy
      - key: JWT_SECRET
        generateValue: true

      # ⚠️ Debes pegar tu API Key de Anthropic en el dashboard de Render
      - key: ANTHROPIC_API_KEY
        sync: false

      # Después de saber tu URL de Vercel, actualiza este valor
      # p.ej. https://educandes.vercel.app
      - key: CORS_ORIGIN
        sync: false

# Base de datos PostgreSQL gratuita (Render)
databases:
  - name: educandes-db
    databaseName: educandes
    user: educandes
    plan: free
    region: oregon
